[project]
name = "llm-remote-orchestrator"
version = "0.2.0"
description = "Unified orchestrator for SageTV + ChannelsDVR + local AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "sentence-transformers>=2.6.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
