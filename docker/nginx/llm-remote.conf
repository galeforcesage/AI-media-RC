# LLM Remote — nginx reverse proxy with TLS
# All services exposed via HTTPS on port 9443 (80/443 are left free for
# other services on this host).
# Three-tier auth:
#   Tier 1: App-level password via session manager, 2-week cookie
#   Tier 2: Admin auth via session manager, session-only cookie
#   Tier 3: MCP Linux uses passwordless sudo locally (no creds from browser)

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 9443 ssl;
    server_name YOUR_SERVER_IP;

    # Redirect plain-HTTP requests sent to this TLS port back to HTTPS
    error_page 497 https://$host:9443$request_uri;

    ssl_certificate     /etc/ssl/certs/llm-remote.crt;
    ssl_certificate_key /etc/ssl/private/llm-remote.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Frontend (static HTML5 remote) ──────────────────────
    root /home/USER_HOME/AI-media-RC/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of JS/CSS so frontend updates take effect immediately
    location ~* \.(js|css)$ {
        root /home/USER_HOME/AI-media-RC/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Orchestrator API ────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SSE streaming endpoint (no buffering) ───────────────
    location /api/query/stream {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/query/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── System commands (rate-limited more aggressively) ────
    location /api/system {
        limit_req zone=admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/system;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Session Manager ─────────────────────────────────────
    # Auth endpoints — strict rate limit (10 req/min)
    location /session/auth/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8769/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /session/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8769/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket STT ─────────────────────────────────────
    location /ws/stt {
        proxy_pass http://127.0.0.1:8000/ws/stt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── WebSocket for MCP (orchestrator) ────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
